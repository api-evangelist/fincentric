name: Fincentric
description: >-
  Fincentric Corporation was a Canadian core retail and wealth banking software
  vendor founded in 1984 and headquartered in Richmond, British Columbia. It
  provided account processing, core banking, and wealth management technology to
  credit unions and financial institutions, serving roughly 167 clients worldwide
  and claiming a large share of Canada's top credit unions. Backed by Battery
  Ventures alongside BancBoston Ventures, HarbourVest Partners, Shasta Ventures,
  and Ventures West Capital, the company was acquired by US core-banking vendor
  Open Solutions in May 2007; Open Solutions was itself acquired by Fiserv in 2013.
  Fincentric no longer operates as an independent company and publishes no live
  developer portal, public API, or documentation surface. This profile is retained
  as a historical/defunct entry — there are no API artifacts to enrich.
